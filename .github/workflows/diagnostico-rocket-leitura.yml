name: Diagnostico - Leitura Rocket (descartavel)

on:
  workflow_dispatch: {}

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Ler cliente no Rocket (somente leitura)
        env:
          ROCKET_BASE_URL: ${{ secrets.ROCKET_BASE_URL }}
          ROCKET_API_KEY: ${{ secrets.ROCKET_API_KEY }}
        run: node scripts/diagnostico-leitura-rocket.mjs
