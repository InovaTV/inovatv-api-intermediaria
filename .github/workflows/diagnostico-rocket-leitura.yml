name: Diagnostico - Leitura Rocket (descartavel)

on:
  workflow_dispatch: {}

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Ler cliente via renovacao-sigma-cliente (somente leitura)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          RENOVACAO_SIGMA_CALLBACK_TOKEN: ${{ secrets.RENOVACAO_SIGMA_CALLBACK_TOKEN }}
        run: node scripts/diagnostico-leitura-rocket.mjs
